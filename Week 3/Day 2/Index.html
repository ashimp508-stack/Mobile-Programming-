<!DOCTYPE html>
<html>
<head>
    <title>jQuery Profile Card</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</head>

<body>

<div class="container">

    <h1>✨ Student Profile</h1>

    <!-- Profile Card -->
    <div id="profile-card">

        <img
            id="profile-photo"
            src="image/profile.jpeg"
            alt="Profile Photo"
        >

        <h2 id="student-name">Student Name</h2>

        <p id="student-bio">
            Hello! I am a student learning HTML, CSS,
            JavaScript and jQuery.
        </p>

        <input
            type="text"
            id="nickname-input"
            placeholder="Enter nickname"
        >

        <ul id="skills-list">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>jQuery</li>
        </ul>

    </div>


    <!-- Controls -->
    <div class="controls">

        <h2>jQuery Controls</h2>

        <div class="button-group">

            <button id="show-name">Show Name</button>
            <button id="change-name">Change Name</button>
            <button id="show-bio">Show Bio</button>

            <button id="get-input">Get Input</button>
            <button id="set-input">Set Input</button>

            <button id="highlight-card">Highlight Card</button>
            <button id="remove-highlight">Remove Highlight</button>

            <button id="toggle-dark">Dark Mode</button>
            <button id="toggle-rounded">Toggle Rounded</button>

            <button id="red-background">Red Background</button>
            <button id="reset-background">Reset Background</button>

            <button id="hide-photo">Hide Photo</button>
            <button id="show-photo">Show Photo</button>

            <button id="toggle-bio">Toggle Bio</button>

            <button id="fade-out">Fade Out</button>
            <button id="fade-in">Fade In</button>
            <button id="fade-50">Fade 50%</button>

            <button id="slide-up">Slide Up</button>
            <button id="slide-down">Slide Down</button>
            <button id="slide-toggle">Slide Toggle</button>

            <button id="animate-card">Animate Card</button>

        </div>

        <div id="output">
            Output will appear here
        </div>

    </div>

</div>

</body>
</html>
